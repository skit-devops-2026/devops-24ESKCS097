<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Releaf-Book</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="index.html" class="logo">
            📚 Releaf-Book
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html" class="register-btn">
                Register
            </a>

        </nav>

    </header>


    <!-- ================= LOGIN SECTION ================= -->

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">
                📚
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to continue to Releaf-Book
            </p>


            <!-- LOGIN FORM -->

            <form id="login-form">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- REMEMBER ME -->

                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="remember-me">

                        Remember me

                    </label>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-btn">

                    Login

                </button>


                <!-- MESSAGE -->

                <p id="login-message" class="form-message"></p>


            </form>


            <!-- REGISTER LINK -->

            <p class="switch-auth">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            📚 Releaf-Book
        </h3>

        <p>
            Give your books a second life.
        </p>

        <p class="copyright">
            © 2026 Releaf-Book. All Rights Reserved.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Releaf-Book</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="index.html" class="logo">
            📚 Releaf-Book
        </a>

        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html" class="login-btn">
                Login
            </a>

        </nav>

    </header>


    <!-- ================= REGISTER SECTION ================= -->

    <main class="auth-page">

        <div class="auth-card register-card">

            <div class="auth-icon">
                📖
            </div>

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Join the Releaf-Book community
            </p>


            <!-- REGISTER FORM -->

            <form id="register-form">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required>

                </div>


                <!-- TERMS -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        I agree to the
                        <a href="#">
                            Terms & Conditions
                        </a>

                    </label>

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="auth-btn">

                    Create Account

                </button>


                <!-- MESSAGE -->

                <p id="register-message" class="form-message"></p>


            </form>


            <!-- LOGIN LINK -->

            <p class="switch-auth">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            📚 Releaf-Book
        </h3>

        <p>
            Give your books a second life.
        </p>

        <p class="copyright">
            © 2026 Releaf-Book. All Rights Reserved.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>

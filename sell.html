<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell a Book | Releaf-Book</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/sell.css">

</head>


<body>

    <!-- ================= NAVBAR ================= -->

   <header class="navbar">

    <div class="logo">
        <span>Releaf</span>-Book
    </div>

    <nav class="nav-links">

        <a href="home.html">
            Home
        </a>

        <a href="sell.html" class="active">
            Sell Book
        </a>

        <a href="listing.html">
            Listed Books
        </a>

        <a href="bought.html">
            Bought Books
        </a>

        <a href="sold.html">
            Sold Books
        </a>

        <a href="wishlist.html">
            Wishlist
        </a>

    </nav>

    <button class="logout-btn" id="logoutBtn">
        Logout
    </button>

</header>


   <!-- ================= SELL DASHBOARD ================= -->

<section class="sell-dashboard">

    <div class="dashboard-header">

        <div>
            <p class="small-heading">
                SELL
            </p>

            <h1>
                My Listed Books
            </h1>

            <p>
                Manage the books you are selling on Releaf-Book.
            </p>
        </div>


         <a
            href="listing.html"
            class="list-book-btn"
        >
            + List a New Book
        </a>

    </div>


    <div id="listings-container">

        <!-- JavaScript creates listings here -->

    </div>

</section>










    <!-- ================= FOOTER ================= -->

    <footer>

        <h3>
            📚 Releaf-Book
        </h3>

        <p>
            Find books. Give books a second life.
        </p>

        <p>
            © 2026 Releaf-Book
        </p>

    </footer>

<!-- ================= PHOTO GALLERY ================= -->

<div
    id="photo-gallery"
    class="photo-gallery"
>

    <button
        id="close-gallery"
        class="close-gallery"
    >
        ✕
    </button>


    <div class="gallery-content">

        <img
            id="gallery-main-image"
            src=""
            alt="Book photo"
        >


        <div
            id="gallery-thumbnails"
            class="gallery-thumbnails"
        >
        </div>

    </div>

</div>

<script src="js/sell.js"></script>

</html>
